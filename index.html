<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0B1A33">
<title>Find the Hidden Phone</title>
<style>
  :root { --navy:#0B1A33; --navy2:#12284a; --line:#1c3560; --white:#fff; --muted:#a9b7cf;
          --cyan:#22D3EE; --orange:#F97316; --panel:#0f2242; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--navy); color:var(--white);
               font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  html { touch-action:manipulation; }   /* no double-tap or pinch zoom that can get stuck */
  body { display:flex; flex-direction:column; min-height:100dvh; -webkit-tap-highlight-color:transparent; }
  header { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
           padding:10px max(14px, env(safe-area-inset-left)) 8px max(14px, env(safe-area-inset-right)); }
  h1 { font-size:22px; margin:0; font-weight:700; letter-spacing:.01em; }
  .levels { display:flex; gap:8px; }
  .levels button { width:58px; height:58px; border-radius:14px; border:1px solid var(--line); background:var(--navy2);
                   color:var(--muted); font-family:inherit; font-size:24px; font-weight:700; line-height:1; cursor:pointer; }
  .levels button.on { background:var(--cyan); color:var(--navy); border-color:var(--cyan); }
  main { flex:1; display:flex; flex-direction:column; gap:10px; padding:0 max(10px, env(safe-area-inset-left)) 12px max(10px, env(safe-area-inset-right)); min-height:0; }
  #mapwrap { display:flex; justify-content:center; align-items:flex-start; flex:0 0 auto; }
  svg#map { width:min(100%, 900px, 62dvh); aspect-ratio:1/1; height:auto; display:block; touch-action:none;
            border-radius:16px; border:1px solid var(--line); background:var(--navy); user-select:none; -webkit-user-select:none; }
  #panel { background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:14px 16px;
           display:flex; flex-direction:column; gap:10px; }
  .lvl { color:var(--cyan); font-weight:700; font-size:15px; text-transform:uppercase; letter-spacing:.06em; }
  #prompt { font-size:19px; font-weight:600; line-height:1.35; margin:0; }
  #feedback { font-size:16px; line-height:1.4; color:var(--white); min-height:1.4em; margin:0; }
  #feedback.good { color:var(--orange); font-weight:700; }
  .row { display:flex; gap:10px; flex-wrap:wrap; }
  .row button.btn { flex:1 1 auto; min-height:62px; font-size:21px; white-space:nowrap; padding:0 14px; }
  button.btn { min-height:44px; padding:0 16px; border-radius:12px; border:1px solid var(--line); background:var(--navy2);
               color:var(--white); font-family:inherit; font-size:16px; font-weight:600; line-height:1; cursor:pointer; }
  button.btn.primary { background:var(--cyan); color:var(--navy); border-color:var(--cyan); }
  button.btn.warn { background:var(--orange); color:var(--navy); border-color:var(--orange); }
  button.btn:disabled { opacity:.4; cursor:default; }
  .slider { display:flex; flex-direction:column; gap:6px; }
  .slider label { font-size:16px; }
  .slider label b { color:var(--orange); }
  input[type=range] { width:100%; height:44px; accent-color:var(--orange); }
  #lastguess { font-size:19px; font-weight:800; color:#FBBF24; }
  #lastguess:empty { display:none; }
  .note { font-size:14px; line-height:1.4; color:var(--muted); }
  .note b { color:#fff; }
  [hidden] { display:none !important; }

  /* landscape phones, tablets and computers: map left, controls right */
  @media (min-width:760px), (orientation:landscape) and (max-height:560px) {
    main { flex-direction:row; align-items:flex-start; justify-content:center; }
    #mapwrap { flex:1 1 auto; max-width:900px; }
    svg#map { width:min(100%, 900px, calc(100dvh - 90px)); }
    #panel { flex:0 0 330px; max-height:calc(100dvh - 90px); overflow:auto; }
  }
  @media (orientation:landscape) and (max-height:560px) {
    header { padding-top:6px; padding-bottom:4px; }
    h1 { font-size:18px; }
    .levels button { width:44px; height:44px; font-size:19px; }
    .row button.btn { min-height:48px; font-size:17px; }
    #panel { flex-basis:280px; padding:10px 12px; gap:8px; }
    #prompt { font-size:16px; }
    svg#map { width:min(100%, calc(100dvh - 70px)); }
    #panel { max-height:calc(100dvh - 70px); }
  }
  @media (min-width:1100px) { h1 { font-size:26px; } #prompt { font-size:21px; } #panel { flex-basis:360px; } }

  /* svg pieces */
  .circle { fill:rgba(34,211,238,.06); stroke:var(--cyan); stroke-width:2.5; vector-effect:non-scaling-stroke; transition:stroke-dasharray .2s; }
  .circle.fuzzy { stroke-dasharray:7 6; filter:url(#blur); }
  .dist { fill:var(--cyan); font-weight:700; paint-order:stroke; stroke:var(--navy); stroke-width:4px; stroke-linejoin:round; vector-effect:non-scaling-stroke; }
  .xdot { fill:#fff; animation:pulse 1.1s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
  @keyframes pulse { 0%,100% { opacity:.55; transform:scale(.8); } 50% { opacity:1; transform:scale(1.25); } }
  .ripple { fill:none; stroke:var(--cyan); stroke-width:2; vector-effect:non-scaling-stroke; transform-box:fill-box; transform-origin:center;
            animation:ripple 1.2s ease-out forwards; }
  .ripple.o { stroke:var(--orange); animation-iteration-count:3; }
  @keyframes ripple { from { transform:scale(.2); opacity:1; } to { transform:scale(3); opacity:0; } }
  .sat.dragging { filter:drop-shadow(0 0 10px rgba(34,211,238,.95)); }
  .sat.locked { opacity:.25; }
  .docktext { fill:var(--muted); }
  .phone-pop { animation:pop .5s cubic-bezier(.2,1.6,.4,1) both; transform-box:fill-box; transform-origin:center; }
  @keyframes pop { from { transform:scale(0); } to { transform:scale(1); } }
  .bigword { fill:var(--orange); font-weight:800; paint-order:stroke; stroke:var(--navy); stroke-width:6px; vector-effect:non-scaling-stroke; }

  /* closing screen */
  #closing { position:fixed; inset:0; background:rgba(11,26,51,.96); display:flex; flex-direction:column; align-items:center;
             justify-content:center; gap:28px; text-align:center; padding:24px; z-index:10; }
  #closing p { font-size:clamp(28px, 6vw, 64px); font-weight:800; margin:0; line-height:1.15; }
  #closing p span { color:var(--orange); }
  @media (prefers-reduced-motion: reduce) { .xdot, .ripple, .phone-pop { animation:none; } }
</style>
</head>
<body>
<header>
  <h1>Find the hidden phone</h1>
  <nav class="levels" aria-label="Level">
    <button data-l="1">1</button><button data-l="2">2</button><button data-l="3">3</button><button data-l="4">4</button><button data-l="5">5</button>
  </nav>
</header>
<main>
  <div id="mapwrap">
    <svg id="map" viewBox="0 0 1000 1000" role="application" aria-label="Map. Drag satellites onto it and tap to guess where the phone is.">
      <defs>
        <filter id="blur" x="-5%" y="-5%" width="110%" height="110%"><feGaussianBlur stdDeviation="2.2"/></filter>
        <clipPath id="clip"><rect width="1000" height="1000" rx="16"/></clipPath>
      </defs>
      <g id="bg"></g>
      <g id="dyn" clip-path="url(#clip)"></g>
    </svg>
  </div>
  <section id="panel" aria-live="polite">
    <div id="lastguess"></div>
    <div class="lvl" id="lvlname"></div>
    <p id="prompt"></p>
    <p id="feedback"></p>
    <div class="slider" id="sliderbox" hidden>
      <label for="err">Phone clock error: <b id="errval">0</b></label>
      <input type="range" id="err" min="0" max="1" step="0.01" value="0">
    </div>
    <div class="row">
      <button class="btn warn" id="fix" hidden>Fix my clock</button>
      <button class="btn primary" id="next">Next level →</button>
      <button class="btn" id="newphone">New phone</button>
    </div>
  </section>
</main>
<div id="closing" hidden>
  <p>Four satellites.<br><span>One very good guess.</span></p>
  <div class="row" style="justify-content:center">
    <button class="btn primary" id="again">Play again</button>
    <button class="btn" id="close">Back to the map</button>
  </div>
</div>

<script>
(() => {
  const M_PER_UNIT = 5;            // 1000 map units = 5 km
  const ERR_UNITS = 300 / M_PER_UNIT; // 1 microsecond of clock error = 300 m
  const DOCK_Y = 150;              // satellites above this line are parked
  const TOL = 30;                  // tap tolerance in map units (150 m)
  const DOCK = [[140, 58], [380, 58], [620, 58], [860, 58]];
  const AUTO = [[130, 330], [870, 300], [560, 890], [150, 860]];
  const SKY = 330;                 // satellites must stay at least this far from the centre (the outer sky zone)
  const PHONE_BOX = 240;           // the phone hides within this distance of the centre   // used when jumping ahead
  const LEVELS = {
    1: { n:1, name:'Level 1 · One satellite', prompt:'Drag satellite 1 into the sky zone.' },
    2: { n:2, name:'Level 2 · Two satellites', prompt:'Add satellite 2. The phone is on both circles. Tap where you think the phone is.' },
    3: { n:3, name:'Level 3 · Three satellites', prompt:'Add satellite 3. The phone is on all three circles. Tap where you think the phone is.' },
    4: { n:3, name:'Level 4 · The cheap clock', prompt:"Slide the phone's clock error up. What happens?" },
    5: { n:4, name:'Level 5 · The fourth satellite', prompt:"Add satellite 4, then press “Fix my clock”." },
  };
  const teacher = new URLSearchParams(location.search).get('teacher') === '1';

  const S = { level:1, phone:null, sats:[1,2,3,4].map((id, i) => ({ id, x:DOCK[i][0], y:DOCK[i][1], placed:false })),
              err:0, guesses:0, lastOff:null, guess:null, solved:false, fixed:false, drag:null, pulses:[] };

  const $ = id => document.getElementById(id);
  const svg = $('map'), dyn = $('dyn');
  const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
  const fmt = units => { const m = units * M_PER_UNIT; return m < 1000 ? `${Math.round(m / 10) * 10} m` : `${(m / 1000).toFixed(1)} km`; };

  function newPhone() {
    S.phone = { x: 500 + (Math.random() * 2 - 1) * PHONE_BOX, y: 500 + (Math.random() * 2 - 1) * PHONE_BOX };
    S.guess = null; S.guesses = 0; S.lastOff = null; S.solved = false; S.fixed = false;
    say('');
    render();
  }

  // ---------- background: grid and a few soft streets ----------
  (function drawBg() {
    let s = '<rect width="1000" height="1000" fill="#0B1A33"/>';
    for (let i = 100; i < 1000; i += 100) s += `<path d="M${i} 0V1000M0 ${i}H1000" stroke="#16305a" stroke-width="1" vector-effect="non-scaling-stroke"/>`;
    const streets = ['M-20 420 C 200 380, 380 470, 560 430 S 880 360, 1020 400', 'M300 -20 C 330 220, 260 420, 320 640 S 380 900, 340 1020',
                     'M640 1020 C 660 820, 720 700, 700 520 S 760 200, 820 -20', 'M-20 760 C 220 740, 480 800, 1020 720'];
    for (const d of streets) s += `<path d="${d}" fill="none" stroke="#1a3866" stroke-width="7" stroke-linecap="round" opacity=".7"/>`;
    // shaded outer sky zone (satellites go here)
    s += `<path d="M0 ${DOCK_Y}H1000V1000H0Z M${500 - SKY} ${500 - SKY}V${500 + SKY}H${500 + SKY}V${500 - SKY}Z" fill="rgba(34,211,238,.07)" fill-rule="evenodd"/>`;
    s += `<line x1="0" y1="${DOCK_Y}" x2="1000" y2="${DOCK_Y}" stroke="#2a4a7c" stroke-dasharray="6 8" vector-effect="non-scaling-stroke"/>`;
    $('bg').innerHTML = s;
  })();

  // ---------- geometry ----------
  function radius(sat) { return dist(sat, S.phone) + S.err * ERR_UNITS; }
  function active() { return S.sats.slice(0, LEVELS[S.level].n); }
  function placed() { return active().filter(s => s.placed); }
  function intersections(cs) {
    const pts = [];
    for (let i = 0; i < cs.length; i++) for (let j = i + 1; j < cs.length; j++) {
      const a = cs[i], b = cs[j], d = Math.hypot(b.x - a.x, b.y - a.y);
      if (d < 1e-6 || d > a.r + b.r || d < Math.abs(a.r - b.r)) continue;
      const l = (a.r * a.r - b.r * b.r + d * d) / (2 * d), h = Math.sqrt(Math.max(0, a.r * a.r - l * l));
      const mx = a.x + l * (b.x - a.x) / d, my = a.y + l * (b.y - a.y) / d;
      pts.push({ x: mx + h * (b.y - a.y) / d, y: my - h * (b.x - a.x) / d });
      if (h > .5) pts.push({ x: mx - h * (b.y - a.y) / d, y: my + h * (b.x - a.x) / d });
    }
    return pts;
  }
  function upp() { const r = svg.getBoundingClientRect(); return 1000 / Math.max(1, r.width); }  // map units per screen px

  // ---------- drawing ----------
  function satSvg(s, k, cls) {
    return `<g class="sat ${cls}" transform="translate(${s.x} ${s.y}) scale(${k})">
      <rect x="-25" y="-6" width="15" height="12" rx="1.5" fill="#22D3EE"/><rect x="10" y="-6" width="15" height="12" rx="1.5" fill="#22D3EE"/>
      <line x1="-10" y1="0" x2="10" y2="0" stroke="#fff" stroke-width="2"/>
      <rect x="-9" y="-10" width="18" height="20" rx="3" fill="#fff"/>
      <text x="0" y="5" text-anchor="middle" font-size="13" font-weight="800" fill="#0B1A33">${s.id}</text></g>`;
  }
  function labelPos(s, r) {
    let best = null, bestScore = -1;
    for (let a = 0; a < 16; a++) {
      const t = a / 16 * Math.PI * 2, x = s.x + Math.cos(t) * r, y = s.y + Math.sin(t) * r;
      if (x < 60 || x > 940 || y < DOCK_Y + 30 || y > 970) continue;
      const score = dist({ x, y }, S.phone);
      if (score > bestScore) { bestScore = score; best = { x, y }; }
    }
    return best;
  }

  function render() {
    const k = upp(), fs = 15 * k;
    let s = '';
    const lv = LEVELS[S.level], act = active(), pl = placed();
    const circles = pl.map(p => ({ x: p.x, y: p.y, r: radius(p), id: p.id }));
    const fuzzy = S.err > 0.001 ? ' fuzzy' : '';
    for (const c of circles) s += `<circle class="circle${fuzzy}" cx="${c.x}" cy="${c.y}" r="${c.r}"/>`;
    for (const c of circles) {
      const lp = labelPos(c, c.r);
      if (lp) {
        const mx = (c.x + lp.x) / 2, my = (c.y + lp.y) / 2;
        s += `<line x1="${c.x}" y1="${c.y}" x2="${lp.x}" y2="${lp.y}" stroke="#22D3EE" stroke-width="1.5" stroke-dasharray="5 5" opacity=".8" vector-effect="non-scaling-stroke"/>`;
        s += `<text class="dist" x="${mx}" y="${my}" font-size="${fs * 1.1}" text-anchor="middle" dominant-baseline="middle">${fmt(c.r)}</text>`;
      }
    }
    if (circles.length >= 2) for (const p of intersections(circles)) s += `<circle class="xdot" cx="${p.x}" cy="${p.y}" r="${6 * k}"/>`;
    for (const p of S.pulses) s += `<circle class="ripple" cx="${p.x}" cy="${p.y}" r="${20 * k}"/>`;
    if (S.guess && !S.solved) {
      const g = S.guess, a = 9 * k;
      s += `<path d="M${g.x - a} ${g.y - a}L${g.x + a} ${g.y + a}M${g.x + a} ${g.y - a}L${g.x - a} ${g.y + a}" stroke="#fff" stroke-width="3" stroke-linecap="round" vector-effect="non-scaling-stroke"/>`;
    }
    // the phone: shown when found, in levels 4-5, or in teacher mode
    const showPhone = S.solved || S.level >= 4 || teacher;
    if (showPhone) {
      const p = S.phone, faint = !(S.solved || S.level >= 4) ? ' opacity=".55"' : '';
      s += `<g${faint} class="${S.solved ? 'phone-pop' : ''}" transform="translate(${p.x} ${p.y}) scale(${k})">
        <rect x="-9" y="-15" width="18" height="30" rx="4" fill="#0B1A33" stroke="#fff" stroke-width="2"/>
        <circle r="5" fill="#F97316"/></g>`;
      if (S.solved) s += `<circle class="ripple o" cx="${p.x}" cy="${p.y}" r="${16 * k}"/>`;
    }
    if (S.solved && S.level === 3) {
      const y = S.phone.y > 500 ? S.phone.y - 60 * k : S.phone.y + 70 * k;
      s += `<text class="bigword" x="${Math.min(800, Math.max(200, S.phone.x))}" y="${y}" font-size="${34 * k}" text-anchor="middle">Trilateration!</text>`;
    }
    // satellites (unavailable ones dimmed in the dock)
    s += `<text class="docktext" x="${1000 - 18 * k}" y="${1000 - 18 * k}" font-size="${26 * k}" font-weight="700" text-anchor="end">sky zone</text>`;
    S.sats.forEach((x, i) => {
      const avail = i < lv.n;
      s += satSvg(x, k * 1.25, (S.drag === x ? 'dragging' : '') + (avail ? '' : ' locked'));
    });
    dyn.innerHTML = s;
    updatePanel();
  }

  // ---------- panel ----------
  function say(t, good) { const f = $('feedback'); f.textContent = t; f.className = good ? 'good' : ''; }
  function updatePanel() {
    const lv = LEVELS[S.level];
    $('lvlname').textContent = lv.name;
    $('prompt').textContent = lv.prompt;
    document.querySelectorAll('.levels button').forEach(b => b.classList.toggle('on', +b.dataset.l === S.level));
    $('sliderbox').hidden = S.level < 4;
    $('err').value = S.err;
    $('errval').textContent = S.err < 0.005 ? '0 (perfect)' : `${S.err.toFixed(2)} µs = ${Math.round(S.err * 300)} m`;
    $('fix').hidden = S.level !== 5;
    $('fix').disabled = !(S.sats[3].placed && S.err > 0.004);
    $('next').textContent = S.level < 5 ? 'Next level →' : 'Finish';
    $('lastguess').textContent = S.level <= 3 && S.lastOff != null ? `Your last guess was ${fmt(S.lastOff)} off.` : '';
  }

  function setLevel(l) {
    S.level = l; S.guess = null; S.drag = null;   // clear the marker; the gold line keeps the score
    if (l <= 3) { S.err = 0; S.solved = false; S.fixed = false; }
    if (l >= 4) {                                   // make sure 3 satellites are on the map
      for (let i = 0; i < 3; i++) if (!S.sats[i].placed) Object.assign(S.sats[i], { x: AUTO[i][0], y: AUTO[i][1], placed: true });
      S.solved = false;
    }
    if (l === 5 && S.err < 0.05) S.err = 0.6;
    if (l < 5) { const s4 = S.sats[3]; Object.assign(s4, { x: DOCK[3][0], y: DOCK[3][1], placed: false }); }
    for (let i = LEVELS[l].n; i < 4; i++) Object.assign(S.sats[i], { x: DOCK[i][0], y: DOCK[i][1], placed: false });
    say(l === 5 ? `Your phone's clock is ${Math.round(S.err * 300)} m out, so the circles don't meet.` : '');
    render();
  }

  // ---------- input ----------
  function toMap(e) {
    const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
    const p = pt.matrixTransform(svg.getScreenCTM().inverse());
    return { x: p.x, y: p.y };
  }
  let down = null;
  svg.addEventListener('pointerdown', e => {
    const p = toMap(e), k = upp(), hit = Math.max(38, 30 * k);
    let best = null, bd = Infinity;
    active().forEach(s => { const d = dist(s, p); if (d < hit && d < bd) { bd = d; best = s; } });
    svg.setPointerCapture(e.pointerId);
    if (best) { S.drag = best; best.wasPlaced = best.placed; render(); }
    else down = { x: e.clientX, y: e.clientY, p };
    e.preventDefault();
  });
  svg.addEventListener('pointermove', e => {
    if (!S.drag) return;
    const p = toMap(e);
    let x = Math.min(975, Math.max(25, p.x)), y = Math.min(975, Math.max(25, p.y));
    // follow the finger freely; a satellite in the middle has no circle until it's back in the sky zone
    S.drag.x = x; S.drag.y = y;
    S.drag.placed = y > DOCK_Y && !inMiddle(S.drag);
    render();
  });
  function end(e) {
    if (S.drag) {
      const s = S.drag; S.drag = null;
      if (s.y > DOCK_Y && inMiddle(s)) { glideToSky(s); return; }   // dropped in the middle: glide out to the sky zone
      if (!s.placed) { s.x = DOCK[s.id - 1][0]; s.y = DOCK[s.id - 1][1]; }
      else if (!s.wasPlaced) { pulse(s); }
      render(); afterMove(s);
    } else if (down) {
      const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y);
      if (moved < 12 && down.p.y > DOCK_Y) guess(down.p);
      down = null;
    }
  }
  function inMiddle(p) { return Math.abs(p.x - 500) < SKY && Math.abs(p.y - 500) < SKY; }
  function glideToSky(s) {
    const dx = s.x - 500, dy = s.y - 500, x0 = s.x, y0 = s.y;
    const tx = Math.abs(dx) > Math.abs(dy) ? 500 + Math.sign(dx || 1) * SKY : x0;
    const ty = Math.abs(dx) > Math.abs(dy) ? y0 : 500 + Math.sign(dy || 1) * SKY;
    const t0 = performance.now();
    (function step(now) {
      const t = Math.min(1, (now - t0) / 220), e = 1 - (1 - t) ** 3;
      s.x = x0 + (tx - x0) * e; s.y = y0 + (ty - y0) * e;
      if (t < 1) { render(); requestAnimationFrame(step); return; }
      s.placed = true; if (!s.wasPlaced) pulse(s);
      render(); afterMove(s);
    })(t0);
  }
  svg.addEventListener('pointerup', end);
  svg.addEventListener('pointercancel', end);

  function pulse(s) { const p = { x: s.x, y: s.y }; S.pulses.push(p); setTimeout(() => { S.pulses.splice(S.pulses.indexOf(p), 1); }, 1300); }

  function afterMove(moved) {
    const lv = LEVELS[S.level], pl = placed();
    if (S.level <= 3 && moved && moved.placed && !S.solved)
      say(`Satellite ${moved.id} is ${fmt(radius(moved))} from the phone.` + (pl.length === lv.n ? ' Tap where you think the phone is.' : ''));
    if (S.level === 5 && S.sats[3].placed && !S.fixed) say('Now press “Fix my clock”.');
  }


  function guess(p) {
    if (S.level > 3 || S.solved) return;
    const lv = LEVELS[S.level], pl = placed();
    if (pl.length < lv.n) { say(`Add satellite ${pl.length + 1} first.`); return; }
    S.guess = p; S.guesses++;
    const off = dist(p, S.phone); S.lastOff = off;
    if (S.level === 2) {
      const xs = intersections(placed().map(s => ({ x: s.x, y: s.y, r: radius(s) })));
      if (xs.some(x => dist(x, p) < TOL * 1.5)) say(off < TOL ? 'Lucky: it could have been either crossing.' : 'It was the other crossing.');
    }
    if (S.level === 3 && off < TOL) { S.solved = true; say("Found it! That's trilateration.", true); }
    render();
  }

  // ---------- controls ----------
  document.querySelectorAll('.levels button').forEach(b => b.addEventListener('click', () => setLevel(+b.dataset.l)));
  $('next').addEventListener('click', () => { if (S.level < 5) setLevel(S.level + 1); else $('closing').hidden = false; });
  $('newphone').addEventListener('click', () => { newPhone(); if (S.level === 5) setLevel(5); });
  $('err').addEventListener('input', e => {
    S.err = +e.target.value; S.fixed = false;
    if (S.level === 4) say(S.err > 0.005 ? `Every circle grows by ${Math.round(S.err * 300)} m, so they don't meet.` : 'No error: the circles meet at the phone.');
    render();
  });
  $('fix').addEventListener('click', () => {
    const from = S.err, t0 = performance.now();
    (function step(now) {
      const u = Math.min(1, (now - t0) / 1200), e = 1 - (1 - u) ** 3;
      S.err = from * (1 - e); render();
      if (u < 1) requestAnimationFrame(step);
      else { S.err = 0; S.fixed = true; S.solved = true; say('All four circles meet again: the 4th satellite fixed the clock.', true); render(); }
    })(t0);
  });
  $('again').addEventListener('click', () => { $('closing').hidden = true; newPhone(); setLevel(1); });
  $('close').addEventListener('click', () => { $('closing').hidden = true; });
  addEventListener('resize', render);

  newPhone(); setLevel(1);
  window.__sim = S;   // for testing
})();
</script>
</body>
</html>
